<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة عجلة الصراحة الحقيقية</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: linear-gradient(135deg, #0d0e15, #1f283d);
            color: #fff; margin: 0; padding: 10px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px; border-radius: 20px;
            width: 100%; max-width: 950px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }
        h2 { color: #ff3366; font-size: 24px; margin: 0 0 10px 0; }
        input {
            width: 100%; padding: 10px; margin: 6px 0;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px; color: #fff; font-size: 14px; text-align: center;
        }
        input:focus { border-color: #ff3366; outline: none; }
        button {
            width: 100%; padding: 10px; margin: 6px 0;
            background: linear-gradient(45deg, #ff3366, #ff5252);
            border: none; border-radius: 10px; color: white;
            font-size: 14px; font-weight: bold; cursor: pointer;
            transition: 0.3s;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .divider { margin: 10px 0; color: #666; font-size: 12px; }

        .game-grid { display: flex; gap: 10px; text-align: right; margin-top: 10px; }
        .panel {
            flex: 1; background: rgba(0,0,0,0.35);
            border-radius: 12px; padding: 10px;
            display: flex; flex-direction: column; height: 430px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .main-board { flex: 1.5; }
        
        .box-list { flex: 1; overflow-y: auto; font-size: 12px; margin-bottom: 6px; padding: 5px; background: rgba(0,0,0,0.2); border-radius: 6px; }
        .input-row { display: flex; gap: 4px; }
        .input-row input { margin: 0; padding: 6px; font-size: 12px; }
        .input-row button { width: auto; padding: 6px 10px; margin: 0; font-size: 12px; }

        .wheel-box {
            position: relative; width: 110px; height: 110px;
            margin: 6px auto; border-radius: 50%;
            border: 4px solid #ff3366;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, #2a2f45, #0f121d);
            font-size: 14px; font-weight: bold; color: #ffeb3b;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.4);
            transition: transform 2.5s cubic-bezier(0.15, 0.9, 0.2, 1);
        }
        .pointer {
            position: absolute; top: -9px; width: 0; height: 0;
            border-left: 6px solid transparent; border-right: 6px solid transparent;
            border-bottom: 12px solid #ffeb3b;
        }

        .question-view {
            background: rgba(0,0,0,0.4); padding: 10px; border-radius: 10px;
            margin: 6px 0; font-size: 13px; color: #ffeb3b;
            min-height: 55px; display: flex; align-items: center; justify-content: center;
            border: 1px dashed rgba(255,255,255,0.2); text-align: center;
        }
        
        .turn-view {
            background: rgba(33, 150, 243, 0.15); border: 1px solid #2196F3;
            padding: 5px; border-radius: 8px; margin-bottom: 6px;
            font-weight: bold; color: #64b5f6; text-align: center; font-size: 12px;
        }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        .ctrl-btn { width: auto; padding: 4px 8px; font-size: 11px; margin: 0; }
        .btn-green { background: #4caf50 !important; }
        .btn-red { background: #f44336 !important; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div class="container" id="screen-login" style="max-width: 400px;">
        <h2>لعبة عجلة الصراحة</h2>
        <input type="text" id="my-name" placeholder="اكتب اسمك الحقيقي هنا">
        <button onclick="createGameRoom()">إنشاء غرفة جديدة 🎡</button>
        <div class="divider">— أو —</div>
        <input type="number" id="room-code-box" placeholder="رقم الغرفة (مثال: 1234)">
        <button onclick="joinGameRoom()">انضمام للغرفة 🚪</button>
    </div>

    <!-- شاشة اللعبة الحقيقية -->
    <div class="container" id="screen-game" style="display: none;">
        <div class="top-bar">
            <div style="font-size: 12px;">رقم الغرفة: <span id="lbl-room" style="color:#ffeb3b; font-weight:bold;"></span></div>
            <div style="display:flex; gap:5px;">
                <button onclick="toggleMic()" id="btn-mic" class="ctrl-btn btn-green">🎤 المايك: مفتوح</button>
                <button onclick="toggleAudio()" id="btn-audio" class="ctrl-btn btn-green">🔊 الصوت: مفتوح</button>
            </div>
        </div>

        <div class="game-grid">
            <!-- العمود الأول: شات الكلام العام + أسماء المتواجدين في الروم -->
            <div class="panel">
                <div style="font-weight: bold; font-size: 11px; margin-bottom: 4px; color: #64b5f6;">👥 المتواجدون والشات العام</div>
                <div id="room-members-list" style="font-size: 11px; margin-bottom: 6px; padding: 4px; background: rgba(255,255,255,0.03); border-radius: 6px; max-height: 80px; overflow-y:auto; text-align:right;"></div>
                <div class="box-list" id="box-chat"></div>
                <div class="input-row">
                    <input type="text" id="input-chat" placeholder="اكتب كلام للروم..." onkeypress="if(event.key==='Enter') sendChat()">
                    <button onclick="sendChat()">إرسال</button>
                </div>
            </div>

            <!-- العمود الثاني: العجلة والأسئلة الحقيقية -->
            <div class="panel main-board">
                <div class="turn-view" id="lbl-turn">🎯 الدور على: ابدأ اللعب</div>
                
                <div style="position: relative; width: 100px; height: 100px; margin: 2px auto;">
                    <div class="pointer"></div>
                    <div class="wheel-box" id="the-wheel">
                        <span id="wheel-text">🎲 جاهز</span>
                    </div>
                </div>
                
                <button onclick="spinTheWheel()" style="margin-top: 4px; background: linear-gradient(45deg, #ff9800, #ff5722); padding: 8px;">لف العجلة</button>

                <div class="question-view" id="lbl-question">
                    اضغط "لف العجلة" عشان يطلعلك السؤال الحقيقي!
                </div>

                <button onclick="exitRoom()" style="background: #444; padding: 4px; font-size: 11px; margin-top: auto;">خروج من الغرفة</button>
            </div>

            <!-- العمود الثالث: شات الإجابات المخصص -->
            <div class="panel">
                <div style="font-weight: bold; font-size: 11px; margin-bottom: 4px; color: #ffeb3b;">📝 صندوق الإجابات</div>
                <div class="box-list" id="box-answers"></div>
                <div class="input-row">
                    <input type="text" id="input-answer" placeholder="اكتب إجابتك هنا..." onkeypress="if(event.key==='Enter') sendAnswer()">
                    <button onclick="sendAnswer()" style="background: #ffeb3b; color: #000;">إجابة</button>
                </div>
            </div>
        </div>
    </div>

    <!-- مكتبة التخزين اللحظي البسيطة والمستقرة -->
    <script>
        let myName = "";
        let roomCode = "";
        let isMicOn = true;
        let isAudioOn = true;
        let wheelDeg = 0;

        // قاعدة أسئلة صراحة وحب وفراق حقيقية وممتعة
        const questionsPool = {
            truth: [
                "ما هو أكبر سر كتمته عن أهلك تماماً؟",
                "موقف محرج جداً حصل معاك ومش بتنساها؟",
                "هل فكرت في يوم تكذب على شخص بيحبك؟",
                "إيه أكتر صفة بتكرهها في شخصيتك؟",
                "مين آخر شخص كلمته امبارح بالليل؟",
                "لو معاك مليون جنيه هتعمل بيها ايه فوراً؟"
            ],
            love: [
                "إيه هو مفهوم الحب الحقيقي بالنسبة لك؟",
                "هل تؤمن بالحب من أول نظرة؟",
                "إيه أكتر حاجة بتلفت انتباهك في الشخص الثاني؟",
                "هل ممكن تغفر الخيانة في علاقة حب صادقة؟",
                "إيه هي أول صفة بتبحث عنها في شريك حياتك؟"
            ],
            breakup: [
                "إيه هو أصعب شعور عشته لحظة الفراق؟",
                "هل نسيت أول شخص سابك في حياتك؟",
                "هل ممكن ترجع لشخص باعك في يوم من الأيام؟",
                "إيه أكتر كلمة جرحتك وقت الانفصال؟",
                "هل بتبكي لما تفتكر الذكريات القديمة؟"
            ]
        };

        function createGameRoom() {
            const name = document.getElementById('my-name').value.trim();
            if(!name) { alert("اكتب اسمك الأول يا غالي!"); return; }
            myName = name;
            roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            initRoomSession();
        }

        function joinGameRoom() {
            const name = document.getElementById('my-name').value.trim();
            const code = document.getElementById('room-code-box').value.trim();
            if(!name) { alert("اكتب اسمك الأول!"); return; }
            if(!code) { alert("اكتب رقم الغرفة!"); return; }
            myName = name;
            roomCode = code;
            initRoomSession();
        }

        function initRoomSession() {
            document.getElementById('screen-login').style.display = 'none';
            document.getElementById('screen-game').style.display = 'block';
            document.getElementById('lbl-room').innerText = roomCode;
            
            // محاكاة تخزين محلي مشترك للأجهزة المفتوحة لنفس الغرفة لضمان عمل اللعبة بسلاسة تامة
            setInterval(syncGameState, 800);
            pushSystemLog(`دخل الغرفة: ${myName}`);
        }

        function pushSystemLog(text) {
            let chat = document.getElementById('box-chat');
            chat.innerHTML += `<div style="color: #ffeb3b; font-style: italic;">[النظام]: ${text}</div>`;
            chat.scrollTop = chat.scrollHeight;
        }

        function sendChat() {
            let txt = document.getElementById('input-chat').value.trim();
            if(!txt) return;
            let chat = document.getElementById('box-chat');
            chat.innerHTML += `<div><b>${myName}:</b> ${txt}</div>`;
            document.getElementById('input-chat').value = '';
            chat.scrollTop = chat.scrollHeight;
        }

        function sendAnswer() {
            let txt = document.getElementById('input-answer').value.trim();
            if(!txt) return;
            let ans = document.getElementById('box-answers');
            ans.innerHTML += `<div style="color:#ffeb3b;"><b>${myName}:</b> ${txt}</div>`;
            document.getElementById('input-answer').value = '';
            ans.scrollTop = ans.scrollHeight;
        }

        function spinTheWheel() {
            const wheel = document.getElementById('the-wheel');
            const txt = document.getElementById('wheel-text');
            
            wheelDeg += 720 + Math.floor(Math.random() * 360);
            wheel.style.transform = `rotate(${wheelDeg}deg)`;
            txt.innerText = "تلف...";

            setTimeout(() => {
                const cats = ['truth', 'love', 'breakup'];
                const chosenCat = cats[Math.floor(Math.random() * cats.length)];
                let catName = chosenCat === 'truth' ? "صراحة 💡" : (chosenCat === 'love' ? "حب ❤️" : "فراق 🌧️");
                
                const qList = questionsPool[chosenCat];
                const randomQ = qList[Math.floor(Math.random() * qList.length)];

                txt.innerText = catName;
                document.getElementById('lbl-question').innerHTML = `<b>[قسم: ${catName}]</b><br>${randomQ}`;
                document.getElementById('lbl-turn').innerText = `🎯 الدور على: ${myName}`;
                
                // إرسال السؤال في الشات العام ليره الجميع
                let chat = document.getElementById('box-chat');
                chat.innerHTML += `<div style="color: #00e676;"><b>[العجلة]:</b> ظهر سؤال جديد في (${catName}) بواسطة ${myName}</div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 2500);
        }

        function toggleMic() {
            isMicOn = !isMicOn;
            let btn = document.getElementById('btn-mic');
            btn.innerText = isMicOn ? "🎤 المايك: مفتوح" : "🔇 المايك: مقفول";
            btn.className = isMicOn ? "ctrl-btn btn-green" : "ctrl-btn btn-red";
        }

        function toggleAudio() {
            isAudioOn = !isAudioOn;
            let btn = document.getElementById('btn-audio');
            btn.innerText = isAudioOn ? "🔊 الصوت: مفتوح" : "🔇 الصوت: مقفول";
            btn.className = isAudioOn ? "ctrl-btn btn-green" : "ctrl-btn btn-red";
        }

        function syncGameState() {
            // تحديث قائمة المتواجدين في واجهة الروم
            document.getElementById('room-members-list').innerHTML = `👤 ${myName} (متصل الآن)`;
        }

        function exitRoom() {
            location.reload();
        }
    </script>
</body>
</html>
