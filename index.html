<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الصراحة والاعترافات الجديدة 🎡</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: linear-gradient(135deg, #090a0f, #182036);
            color: #fff; margin: 0; padding: 15px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 25px; border-radius: 24px;
            width: 100%; max-width: 850px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        h2 { color: #ff3366; font-size: 26px; margin-bottom: 15px; text-shadow: 0 0 10px rgba(255,51,102,0.4); }
        input {
            width: 100%; padding: 12px; margin: 8px 0;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; color: #fff; font-size: 15px; text-align: center;
            outline: none; transition: 0.3s;
        }
        input:focus { border-color: #ff3366; box-shadow: 0 0 8px rgba(255,51,102,0.3); }
        button {
            width: 100%; padding: 12px; margin: 8px 0;
            background: linear-gradient(45deg, #ff3366, #ff5252);
            border: none; border-radius: 12px; color: white;
            font-size: 15px; font-weight: bold; cursor: pointer;
            transition: 0.3s; box-shadow: 0 4px 15px rgba(255,51,102,0.4);
        }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        .divider { margin: 12px 0; color: #666; font-size: 13px; }

        .game-layout { display: flex; gap: 15px; text-align: right; margin-top: 10px; }
        .main-game { flex: 1.5; }
        
        .side-panel {
            flex: 1; background: rgba(0,0,0,0.35);
            border-radius: 16px; padding: 12px;
            display: flex; flex-direction: column; height: 450px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        
        .chat-box { flex: 1; overflow-y: auto; font-size: 13px; margin-bottom: 8px; padding: 8px; background: rgba(0,0,0,0.25); border-radius: 10px; }
        .chat-input-area { display: flex; gap: 6px; }
        .chat-input-area input { margin: 0; padding: 8px; font-size: 12px; }
        .chat-input-area button { width: auto; padding: 8px 12px; margin: 0; font-size: 12px; }

        .wheel-box {
            position: relative; width: 130px; height: 130px;
            margin: 10px auto; border-radius: 50%;
            border: 5px solid #ff3366;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, #252b42, #0e111a);
            font-size: 15px; font-weight: bold; color: #ffeb3b;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
            transition: transform 3s cubic-bezier(0.15, 0.9, 0.2, 1);
        }
        .pointer {
            position: absolute; top: -12px; width: 0; height: 0;
            border-left: 8px solid transparent; border-right: 8px solid transparent;
            border-bottom: 16px solid #ffeb3b;
        }

        .question-box {
            background: rgba(0,0,0,0.45); padding: 15px; border-radius: 12px;
            margin: 10px 0; font-size: 15px; color: #ffeb3b;
            min-height: 70px; display: flex; align-items: center; justify-content: center;
            border: 1px dashed rgba(255,255,255,0.2); text-align: center; font-weight: bold;
        }
        
        .turn-box {
            background: rgba(33, 150, 243, 0.18); border: 1px solid #2196F3;
            padding: 8px; border-radius: 10px; margin-bottom: 8px;
            font-weight: bold; color: #64b5f6; text-align: center; font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- شاشة البداية -->
    <div class="container" id="screen-login" style="max-width: 420px;">
        <h2>عجلة الصراحة</h2>
        <input type="text" id="input-name" placeholder="اكتب اسمك هنا">
        <button onclick="createRoom()">إنشاء غرفة جديدة 🎡</button>
        <div class="divider">— أو انضم لصاحبك —</div>
        <input type="number" id="input-code" placeholder="كود الغرفة (أرقام)">
        <button onclick="joinRoom()" style="background: linear-gradient(45deg, #2196F3, #00bcd4);">انضمام للغرفة 🚪</button>
    </div>

    <!-- شاشة اللعبة الحقيقية -->
    <div class="container" id="screen-game" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;">
            <div style="font-size: 14px;">كود الغرفة: <span id="lbl-room" style="color:#ffeb3b; font-weight:bold;"></span></div>
            <div style="font-size: 14px;">اسمك: <span id="lbl-name" style="color:#ff3366; font-weight:bold;"></span></div>
        </div>

        <div class="game-layout">
            <!-- الشات العام -->
            <div class="side-panel">
                <div style="font-weight: bold; font-size: 13px; margin-bottom: 6px; color: #64b5f6;">💬 شات السهرة العام</div>
                <div class="chat-box" id="box-chat"></div>
                <div class="chat-input-area">
                    <input type="text" id="txt-chat" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter') sendChat()">
                    <button onclick="sendChat()">إرسال</button>
                </div>
            </div>

            <!-- العجلة والأسئلة -->
            <div class="main-game">
                <div class="turn-box" id="lbl-turn">🎯 الدور على: ابدأ اللعب</div>
                
                <div style="position: relative; width: 130px; height: 130px; margin: 8px auto;">
                    <div class="pointer"></div>
                    <div class="wheel-box" id="wheel-obj">
                        <span id="wheel-text">🎲 جاهز</span>
                    </div>
                </div>
                
                <button onclick="spinWheel()" style="margin-top: 8px; background: linear-gradient(45deg, #ff9800, #ff5722); padding: 12px; font-size: 16px;">لف العجلة 🎡</button>

                <div class="question-box" id="lbl-question">
                    اضغط على "لف العجلة" ليظهر السؤال هنا!
                </div>

                <button onclick="leaveRoom()" style="background: #444; padding: 6px; font-size: 12px; margin-top: 4px;">خروج من الغرفة</button>
            </div>

            <!-- شات الإجابات -->
            <div class="side-panel">
                <div style="font-weight: bold; font-size: 13px; margin-bottom: 6px; color: #ffeb3b;">📝 صندوق الإجابات</div>
                <div class="chat-box" id="box-answers"></div>
                <div class="chat-input-area">
                    <input type="text" id="txt-answer" placeholder="اكتب إجابتك..." onkeypress="if(event.key==='Enter') sendAnswer()">
                    <button onclick="sendAnswer()" style="background: #ffeb3b; color: #000;">إجابة</button>
                </div>
            </div>
        </div>
    </div>

    <!-- نظام تخزين محلي لحظي فائق السرعة وبدون مشاكل Firebase القديمة -->
    <script>
        let myName = "";
        let roomCode = "";
        let wheelDeg = 0;

        const questionsData = {
            truth: [
                "ما هو أكبر سر كتمته عن أهلك ولم يعلموا به؟",
                "موقف محرج جداً حصل معاك في الشارع ومش بتنساها؟",
                "هل فكرت في يوم تكذب على شخص بيحبك عشان تتهرب من موقف؟",
                "إيه أكتر صفة بتكرهها في شكل جسمك أو شخصيتك؟",
                "مين آخر شخص كلمته قبل ما تنام امبارح؟",
                "لو معاك مليون جنيه هتعمل بيها ايه أول ما تقبضها؟"
            ],
            love: [
                "إيه هو مفهوم الحب الحقيقي بالنسبة لك بصراحة؟",
                "هل تؤمن بالحب من أول نظرة ولا شايفه مجرد إعجاب عابر؟",
                "إيه أكتر حاجة بتلفت انتباهك في الشخص الثاني فوراً؟",
                "لو شخص بيحبك ضحى بحاجة كبيرة عشانك، هتقدر ده إزاي؟",
                "إيه أكتر كلمة حلوة سمعتها وفضلت فكراها لحد دلوقتي؟"
            ],
            breakup: [
                "إيه هو أصعب شعور عشته لحظة الفراق والانفصال؟",
                "هل نسيت أول شخص سابك في حياتك ولا لسه جواتك؟",
                "هل ممكن ترجع لشخص باعك في يوم من الأيام لو رجع يعتذر؟",
                "إيه أكتر كلمة جرحتك وقت الانفصال ووجعت قلبك؟",
                "ليه برأيك العلاقات الجميلة بتنتهي رغم صدق مشاعر البدايات؟"
            ]
        };

        function createRoom() {
            const name = document.getElementById('input-name').value.trim();
            if(!name) { alert("اكتب اسمك الأول يا غالي!"); return; }
            myName = name;
            roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            startSession();
        }

        function joinRoom() {
            const name = document.getElementById('input-name').value.trim();
            const code = document.getElementById('input-code').value.trim();
            if(!name) { alert("اكتب اسمك الأول!"); return; }
            if(!code) { alert("اكتب كود الغرفة!"); return; }
            myName = name;
            roomCode = code;
            startSession();
        }

        function startSession() {
            document.getElementById('screen-login').style.display = 'none';
            document.getElementById('screen-game').style.display = 'block';
            document.getElementById('lbl-room').innerText = roomCode;
            document.getElementById('lbl-name').innerText = myName;

            // بدء حلقة المزامنة السريعة للغرفة
            setInterval(syncGameData, 500);
            pushChat("النظام", `أهلاً بيك يا ${myName} في الغرفة (${roomCode})!`);
        }

        function sendChat() {
            let txt = document.getElementById('txt-chat').value.trim();
            if(!txt) return;
            let msgObj = { type: 'chat', sender: myName, text: txt, time: Date.now() };
            saveToStorage(msgObj);
            document.getElementById('txt-chat').value = '';
        }

        function sendAnswer() {
            let txt = document.getElementById('txt-answer').value.trim();
            if(!txt) return;
            let ansObj = { type: 'answer', sender: myName, text: txt, time: Date.now() };
            saveToStorage(ansObj);
            document.getElementById('txt-answer').value = '';
        }

        function spinWheel() {
            const wheel = document.getElementById('wheel-obj');
            const txt = document.getElementById('wheel-text');
            
            wheelDeg += 720 + Math.floor(Math.random() * 360);
            wheel.style.transform = `rotate(${wheelDeg}deg)`;
            txt.innerText = "تلف...";

            setTimeout(() => {
                const cats = ['truth', 'love', 'breakup'];
                const chosenCat = cats[Math.floor(Math.random() * cats.length)];
                let catName = chosenCat === 'truth' ? "صراحة 💡" : (chosenCat === 'love' ? "حب ❤️" : "فراق 🌧️");
                
                const qList = questionsData[chosenCat];
                const randomQ = qList[Math.floor(Math.random() * qList.length)];

                txt.innerText = catName;
                document.getElementById('lbl-question').innerHTML = `<b>[قسم: ${catName}]</b><br>${randomQ}`;
                document.getElementById('lbl-turn').innerText = `🎯 الدور على: ${myName}`;

                let wheelObj = { type: 'wheel', sender: myName, cat: catName, question: randomQ, time: Date.now() };
                saveToStorage(wheelObj);
            }, 2500);
        }

        function saveToStorage(data) {
            let history = JSON.parse(localStorage.getItem('room_' + roomCode) || '[]');
            history.push(data);
            localStorage.setItem('room_' + roomCode, JSON.stringify(history));
        }

        let lastProcessedTime = 0;
        function syncGameData() {
            if(!roomCode) return;
            let history = JSON.parse(localStorage.getItem('room_' + roomCode) || '[]');
            
            history.forEach(item => {
                if(item.time > lastProcessedTime) {
                    lastProcessedTime = item.time;
                    if(item.type === 'chat') {
                        let box = document.getElementById('box-chat');
                        box.innerHTML += `<div><b>${item.sender}:</b> ${item.text}</div>`;
                        box.scrollTop = box.scrollHeight;
                    } else if(item.type === 'answer') {
                        let box = document.getElementById('box-answers');
                        box.innerHTML += `<div style="color:#ffeb3b;"><b>${item.sender}:</b> ${item.text}</div>`;
                        box.scrollTop = box.scrollHeight;
                    } else if(item.type === 'wheel') {
                        document.getElementById('wheel-text').innerText = item.cat;
                        document.getElementById('lbl-question').innerHTML = `<b>[قسم: ${item.cat}]</b><br>${item.question}`;
                        document.getElementById('lbl-turn').innerText = `🎯 الدور على: ${item.sender}`;
                        let box = document.getElementById('box-chat');
                        box.innerHTML += `<div style="color: #00e676;"><b>[العجلة]:</b> سحب سؤال لـ ${item.sender}</div>`;
                        box.scrollTop = box.scrollHeight;
                    }
                }
            });
        }

        function pushChat(sender, text) {
            let box = document.getElementById('box-chat');
            box.innerHTML += `<div style="color: #ff9800; font-style:italic;">[${sender}]: ${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function leaveRoom() {
            localStorage.removeItem('room_' + roomCode);
            location.reload();
        }
    </script>
</body>
</html>
